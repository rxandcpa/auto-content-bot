name: Daily Article Generator

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        env:
          PIP_NO_CACHE_DIR: "1"
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Generate & publish articles
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TOUTIAO_COOKIES: ${{ secrets.TOUTIAO_COOKIES || '' }}
          CONTENT_TYPE: ${{ vars.CONTENT_TYPE || 'all' }}
        run: python -m src.main

      - name: Upload articles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-articles
          path: output/
